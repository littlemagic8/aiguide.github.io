<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="798" height="498" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">第 3 步：在 ChatGPT App 内订阅 Plus</text>

  <!-- 左侧提示 -->
  <text x="40" y="140" font-size="14" font-weight="700" fill="#1f2328">小贴士</text>
  <text x="40" y="170" font-size="13" fill="#57606a">订阅成功后权益全端通用，</text>
  <text x="40" y="192" font-size="13" fill="#57606a">网页版 chatgpt.com 同步生效。</text>
  <text x="40" y="230" font-size="13" fill="#57606a">余额不足会扣款失败，</text>
  <text x="40" y="252" font-size="13" fill="#57606a">务必先充值 ≥ $25。</text>
  <text x="40" y="290" font-size="12" fill="#8c959f">取消订阅在 iOS 设置 →</text>
  <text x="40" y="310" font-size="12" fill="#8c959f">Apple ID → 订阅 中管理。</text>

  <!-- 手机框架 -->
  <rect x="250" y="80" width="300" height="380" rx="28" fill="#ffffff" stroke="#d0d7de" stroke-width="2.5"/>
  <rect x="360" y="92" width="80" height="12" rx="6" fill="#e7ebf0"/>
  <text x="400" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">升级套餐</text>

  <!-- Plus 选项 -->
  <rect x="275" y="170" width="250" height="60" rx="10" fill="#f6f8fa" stroke="#10a37f" stroke-width="2"/>
  <text x="291" y="196" font-size="14" font-weight="700" fill="#1f2328">ChatGPT Plus</text>
  <text x="291" y="218" font-size="13" fill="#57606a">$20.00 / 月</text>
  <circle cx="505" cy="200" r="10" fill="#10a37f"/>
  <circle cx="505" cy="200" r="4" fill="#ffffff"/>

  <!-- Pro 选项 -->
  <rect x="275" y="244" width="250" height="60" rx="10" fill="#f6f8fa"/>
  <text x="291" y="270" font-size="14" font-weight="700" fill="#1f2328">ChatGPT Pro</text>
  <text x="291" y="292" font-size="13" fill="#57606a">$200.00 / 月</text>
  <circle cx="505" cy="274" r="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- 订阅按钮 -->
  <rect x="275" y="336" width="250" height="48" rx="24" fill="#10a37f"/>
  <text x="400" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Upgrade to Plus</text>

  <!-- 高亮标注 -->
  <ellipse cx="400" cy="360" rx="148" ry="36" fill="none" stroke="#d5760a" stroke-width="2.5"/>
  <line x1="548" y1="360" x2="580" y2="360" stroke="#d5760a" stroke-width="2"/>
  <text x="588" y="352" font-size="13" font-weight="700" fill="#d5760a">点击订阅</text>
  <text x="588" y="372" font-size="12" fill="#57606a">用 Apple ID 余额扣款</text>

  <text x="400" y="478" text-anchor="middle" font-size="12" fill="#8c959f">示意界面，以实际页面为准</text>
</svg>
