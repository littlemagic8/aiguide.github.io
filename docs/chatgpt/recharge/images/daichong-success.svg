<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="798" height="498" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="400" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">第 5 步：验证 Plus 生效</text>

  <!-- 模拟 ChatGPT 窗口 -->
  <rect x="60" y="80" width="680" height="340" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- 侧边栏 -->
  <rect x="61" y="81" width="199" height="338" rx="11" fill="#f6f8fa"/>
  <rect x="160" y="81" width="100" height="338" fill="#f6f8fa"/>
  <!-- 侧边栏会话条目 -->
  <rect x="80" y="104" width="160" height="14" rx="7" fill="#e7ebf0"/>
  <rect x="80" y="130" width="140" height="14" rx="7" fill="#e7ebf0"/>
  <rect x="80" y="156" width="155" height="14" rx="7" fill="#e7ebf0"/>

  <!-- 主区对话气泡 -->
  <rect x="290" y="110" width="340" height="18" rx="9" fill="#e7ebf0"/>
  <rect x="290" y="142" width="300" height="18" rx="9" fill="#e7ebf0"/>
  <rect x="290" y="174" width="325" height="18" rx="9" fill="#e7ebf0"/>
  <rect x="290" y="206" width="280" height="18" rx="9" fill="#e7ebf0"/>
  <rect x="290" y="250" width="410" height="120" rx="10" fill="#f6f8fa" stroke="#e7ebf0"/>

  <!-- 账号区：头像 + 邮箱 + Plus 徽章 -->
  <circle cx="100" cy="378" r="16" fill="#d0d7de"/>
  <text x="124" y="374" font-size="12" fill="#57606a">user@example.com</text>
  <rect x="124" y="382" width="46" height="20" rx="5" fill="#10a37f"/>
  <text x="147" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Plus</text>

  <!-- 高亮标注 -->
  <ellipse cx="147" cy="392" rx="42" ry="24" fill="none" stroke="#d5760a" stroke-width="2.5"/>
  <line x1="189" y1="392" x2="330" y2="440" stroke="#d5760a" stroke-width="2"/>
  <text x="560" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#d5760a">左下角出现 Plus 标识</text>
  <text x="560" y="452" text-anchor="middle" font-size="13" fill="#57606a">说明权益已到账（网页 / App 全端通用）</text>

  <text x="400" y="484" text-anchor="middle" font-size="12" fill="#8c959f">示意界面，以实际页面为准</text>
</svg>
