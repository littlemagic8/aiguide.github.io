<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="798" height="458" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">Plus 与 Pro 额度量级对比（示意）</text>

  <!-- 图例 -->
  <rect x="230" y="62" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="252" y="76" font-size="14" fill="#1f2328">Plus</text>
  <rect x="310" y="62" width="16" height="16" rx="3" fill="#8b5cf6"/>
  <text x="332" y="76" font-size="14" fill="#1f2328">Pro</text>

  <!-- 行 1：主力对话模型 -->
  <text x="40" y="122" font-size="17" font-weight="700" fill="#1f2328">主力对话模型</text>
  <text x="40" y="144" font-size="12" fill="#8c959f">如 GPT-4o 级别</text>
  <rect x="230" y="106" width="160" height="20" rx="5" fill="#3b82f6"/>
  <text x="398" y="121" font-size="13" fill="#1f2328">数十条 / 3 小时</text>
  <rect x="230" y="134" width="380" height="20" rx="5" fill="#8b5cf6"/>
  <text x="618" y="149" font-size="13" fill="#1f2328">数倍于此</text>

  <!-- 行 2：高级推理模型 -->
  <text x="40" y="232" font-size="17" font-weight="700" fill="#1f2328">高级推理模型</text>
  <text x="40" y="254" font-size="12" fill="#8c959f">如 o1 级别</text>
  <rect x="230" y="216" width="80" height="20" rx="5" fill="#3b82f6"/>
  <text x="318" y="231" font-size="13" fill="#1f2328">约几十条 / 周</text>
  <rect x="230" y="244" width="400" height="20" rx="5" fill="#8b5cf6"/>
  <text x="638" y="259" font-size="13" fill="#1f2328">约上百条 / 天</text>

  <!-- 行 3：顶级模型 -->
  <text x="40" y="342" font-size="17" font-weight="700" fill="#1f2328">顶级模型</text>
  <text x="40" y="364" font-size="12" fill="#8c959f">如 o1-pro</text>
  <text x="230" y="336" font-size="14" fill="#d5760a" font-weight="700">✕ 不支持</text>
  <rect x="230" y="354" width="330" height="20" rx="5" fill="#8b5cf6"/>
  <text x="568" y="369" font-size="13" fill="#1f2328">有每日额度</text>

  <text x="400" y="432" text-anchor="middle" font-size="13" fill="#8c959f">数据为量级示意，官方会动态调整，具体以官方帮助文档为准</text>
</svg>
